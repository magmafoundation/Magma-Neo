project.plugins.apply('dev.lukebemish.immaculate')

abstract class GeneratePackageInfos extends DefaultTask {
    private static final List<String> PACKAGE_ROOTS = [
            'net/neoforged/',
            'org/bukkit/',
            'com/mojang/',
            'org/spigotmc/',
            'org/magmafoundation/',
            'io/izzel/arclight/',
            'com/destroystokyo/paper/',
            'io/papermc/paper/',
            'ca/spottedleaf/concurrentutil/'
    ]

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getFiles();

    protected static String resolvePackageName(File javaFile) {
        def normalizedPath = javaFile.toString().replace(File.separatorChar, '/' as char)
        def packagePath = PACKAGE_ROOTS.findResult { root ->
            def start = normalizedPath.indexOf(root)
            if (start < 0) {
                return null
            }

            def end = normalizedPath.lastIndexOf('/')
            if (end <= start) {
                return null
            }

            return normalizedPath.substring(start, end)
        }

        if (packagePath != null) {
            return packagePath.replace('/', '.')
        }

        def declaredPackage = javaFile.readLines().findResult { line ->
            def trimmed = line.trim()
            if (trimmed.startsWith('package ') && trimmed.endsWith(';')) {
                return trimmed.substring('package '.length(), trimmed.length() - 1).trim()
            }
            return null
        }

        if (declaredPackage != null && !declaredPackage.isEmpty()) {
            return declaredPackage
        }

        throw new GradleException("Cannot infer package name from path or source declaration: ${javaFile}")
    }

    @TaskAction
    void generatePackageInfos() {
        getFiles().each { fileEntry ->
            File javaFile = fileEntry instanceof File ? fileEntry : new File(fileEntry.toString())
            if (javaFile.name.endsWith('.java') && javaFile.name != 'package-info.java') {
                def packageInfoFile = new File(javaFile.parent, 'package-info.java')
                if (!packageInfoFile.exists()) {
                    def pkgName = GeneratePackageInfos.resolvePackageName(javaFile)

                    def pkgInfoText = """
                        |@FieldsAreNonnullByDefault
                        |@MethodsReturnNonnullByDefault
                        |@ParametersAreNonnullByDefault
                        |package $pkgName;
                        |
                        |import javax.annotation.ParametersAreNonnullByDefault;
                        |import net.minecraft.FieldsAreNonnullByDefault;
                        |import net.minecraft.MethodsReturnNonnullByDefault;
                    """.stripMargin().trim()

                    packageInfoFile.text = pkgInfoText
                }
            }
        }
    }
}
final generatePackageInfos = tasks.register('generatePackageInfos', GeneratePackageInfos) {
    it.files.from fileTree("src/main/java")
}

immaculate {
    workflows.register('java') {
        java()
        trailingNewline()
        noTabs()
        googleFixImports()
        toggleOff = 'spotless:off'
        toggleOn = 'spotless:on'
        eclipse {
            version '3.37.0'
            config = rootProject.file('codeformat/formatter-config.xml')
        }


        // courtesy of diffplug/spotless#240
        // https://github.com/diffplug/spotless/issues/240#issuecomment-385206606
        custom 'noWildcardImports', { String fileContents ->
            if (fileContents.contains('*;\n')) {
                throw new GradleException('No wildcard imports are allowed!')
            }
        }

        custom 'jetbrainsNullable', { String fileContents ->
            fileContents.replace('javax.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
        }
    }
}

tasks.named('licenseFormat').configure {
    mustRunAfter generatePackageInfos
}
tasks.named('immaculateApply').configure {
    mustRunAfter generatePackageInfos
    mustRunAfter tasks.named('licenseFormat')
}

tasks.register('applyAllFormatting', Task) {
    dependsOn generatePackageInfos
    dependsOn tasks.named('licenseFormat')
    dependsOn tasks.named('immaculateApply')
    group = 'verification'
}

tasks.register('checkFormatting', Task) {
    dependsOn 'licenseCheck'
    dependsOn 'immaculateCheck'
    group = 'verification'
}

tasks.register('runUnitTests', Task) {
    group = 'verification'
    tasks.withType(Test).each { tsk -> it.dependsOn(tsk) }
}
